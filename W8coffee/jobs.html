    <header>

    <main>

        <div id="herojobs"></div>

        <h2>Jobs at The Coffee Oasis</h2>

        <p>
            Want to work at The Coffee Oasis? Fill out the form below to start your application.
            All information is required.
        </p>

        <form method="post"
              action="http://cs.franklin.edu/~crawforl/webd101/W8coffee.html">

            <label for="myName">Name:</label>
            <input type="text"
                   id="myName"
                   name="myName"
                   required>

            <label for="myEmail">E-mail:</label>
            <input type="email"
                   id="myEmail"
                   name="myEmail"
                   required>

            <label for="myStart">Start Date:</label>
            <input type="date"
                   id="myStart"
                   name="myStart"
                   required>

            <label for="myExperience">Experience:</label>
            <textarea id="myExperience"
                      name="myExperience"
                      rows="2"
                      cols="20"
                      required></textarea>

            <input type="submit"
                   id="mySubmit"
                   value="Apply Now">

        </form>

    </main>
